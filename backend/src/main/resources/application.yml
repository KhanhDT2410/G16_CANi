spring:
  application:
    name: cani-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 35MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://db.hgnilsojrauajmyslhug.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        default_batch_fetch_size: 32
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 0
    clean-disabled: true
    schemas: public
    default-schema: public
    validate-on-migrate: false
    ignore-migration-patterns:
      - "*:missing"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.cani: INFO
    org.springframework.security: INFO

cani:
  auth:
    supabase:
      url: ${SUPABASE_URL:https://hgnilsojrauajmyslhug.supabase.co}
      anon-key: ${SUPABASE_ANON_KEY:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  security:
    document-signing-secret: ${DOCUMENT_SIGNING_SECRET:}
    document-url-ttl-seconds: ${DOCUMENT_URL_TTL_SECONDS:300}
    ekyc-image-signing-secret: ${EKYC_IMAGE_SIGNING_SECRET:${DOCUMENT_SIGNING_SECRET:}}
    ekyc-image-url-ttl-seconds: ${EKYC_IMAGE_URL_TTL_SECONDS:180}
    ekyc-hash-pepper: ${EKYC_HASH_PEPPER:}
  storage:
    certificate-dir: ${CERTIFICATE_STORAGE_DIR:uploads/certificates}
    ekyc-dir: ${EKYC_STORAGE_DIR:uploads/ekyc-private}
    ekyc-max-file-size-bytes: ${EKYC_MAX_FILE_SIZE_BYTES:5242880}
  skill:
    ai:
      enabled: ${SKILL_AI_ENABLED:false}
      provider: ${SKILL_AI_PROVIDER:}
      endpoint: ${SKILL_AI_ENDPOINT:}
      api-key: ${SKILL_AI_API_KEY:}
      model: ${SKILL_AI_MODEL:}
      timeout-ms: ${SKILL_AI_TIMEOUT_MS:25000}
      connection-verified: ${SKILL_AI_CONNECTION_VERIFIED:false}
    gemini:
      enabled: ${SKILL_GEMINI_ENABLED:true}
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_SKILL_MODEL:gemini-flash-lite-latest}
      url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models}
      timeout-ms: ${GEMINI_TIMEOUT_MS:25000}
  ekyc:
    provider: ${EKYC_PROVIDER:vnpt}
    strict: ${EKYC_STRICT:false}
    processing-timeout-seconds: ${EKYC_PROCESSING_TIMEOUT_SECONDS:120}
    processing-recovery-cron: ${EKYC_PROCESSING_RECOVERY_CRON:0 */1 * * * *}
    consent:
      required: ${EKYC_CONSENT_REQUIRED:true}
      notice-version: ${EKYC_CONSENT_NOTICE_VERSION:2026.11-nd13-v1}
    retention:
      approved-image-days: ${EKYC_RETENTION_APPROVED_DAYS:0}
      rejected-image-days: ${EKYC_RETENTION_REJECTED_DAYS:0}
      technical-failure-image-days: ${EKYC_RETENTION_TECH_FAILURE_DAYS:3}
      pending-review-image-days: ${EKYC_RETENTION_PENDING_REVIEW_DAYS:14}
      cleanup-enabled: ${EKYC_RETENTION_CLEANUP_ENABLED:true}
      orphan-grace-hours: ${EKYC_RETENTION_ORPHAN_GRACE_HOURS:24}
      cleanup-cron: ${EKYC_RETENTION_CLEANUP_CRON:0 30 2 * * *}
    vnpt:
      enabled: ${VNPT_EKYC_ENABLED:false}
      base-url: ${VNPT_EKYC_BASE_URL:https://api.idg.vnpt.vn}
      token-id: ${VNPT_EKYC_TOKEN_ID:}
      token-key: ${VNPT_EKYC_TOKEN_KEY:}
      access-token: ${VNPT_EKYC_ACCESS_TOKEN:}
      mac-address: ${VNPT_EKYC_MAC_ADDRESS:}
      timeout-ms: ${VNPT_EKYC_TIMEOUT_MS:25000}
      verify-back-card: ${VNPT_EKYC_VERIFY_BACK_CARD:true}
      ocr-front-path: ${VNPT_EKYC_OCR_FRONT_PATH:/ai/v1/ocr/id/front}
      ocr-back-path: ${VNPT_EKYC_OCR_BACK_PATH:/ai/v1/ocr/id/back}
      face-match-min-threshold: ${VNPT_EKYC_FACE_MATCH_MIN_THRESHOLD:}
      face-match-score-max: ${VNPT_EKYC_FACE_MATCH_SCORE_MAX:}
      face-compare-path: ${VNPT_EKYC_FACE_COMPARE_PATH:/ai/v1/face/compare}
      card-liveness-enabled: ${VNPT_EKYC_CARD_LIVENESS_ENABLED:false}
      card-liveness-path: ${VNPT_EKYC_CARD_LIVENESS_PATH:}
      face-liveness-enabled: ${VNPT_EKYC_FACE_LIVENESS_ENABLED:false}
      face-liveness-path: ${VNPT_EKYC_FACE_LIVENESS_PATH:}
      require-liveness-for-auto-approve: ${VNPT_EKYC_REQUIRE_LIVENESS_FOR_AUTO_APPROVE:true}
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}
  subscription:
    strict: ${SUBSCRIPTION_STRICT:true}
    demo-enabled: ${SUBSCRIPTION_DEMO_ENABLED:false}
  payos:
    endpoint: ${PAYOS_ENDPOINT:https://api-merchant.payos.vn}
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/eo}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/eo?cancel=true}
  sla-scan:
    enabled: ${SLA_SCAN_ENABLED:true}
    cron: ${SLA_SCAN_CRON:0 */15 * * * *}
  shift-lifecycle:
    cron: ${SHIFT_LIFECYCLE_CRON:0 */1 * * * *}
    understaffed-alert-hours: ${SHIFT_UNDERSTAFFED_ALERT_HOURS:4}
    emergency-default-radius-km: ${SHIFT_EMERGENCY_DEFAULT_RADIUS_KM:25}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
