spring:
  datasource:
    url: jdbc:h2:mem:cani;INIT=RUNSCRIPT FROM 'classpath:h2-init.sql';DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: com.cani.config.CustomH2Dialect
        default_schema: ""
        format_sql: false

  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.cani: INFO
    org.springframework.security: WARN

