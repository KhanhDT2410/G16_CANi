spring:
  datasource:
    # Kết nối trực tiếp hoặc qua Session Mode Pooler (Port 5432) để hỗ trợ Flyway migrations
    url: ${DB_URL:jdbc:postgresql://db.hgnilsojrauajmyslhug.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Giữ pool nhỏ (tối đa 5) để không chiếm hết giới hạn 15 connections của Supabase Session Pooler khi nhiều dev cùng chạy
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_schema: public
        default_batch_fetch_size: 32
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 0
    clean-disabled: true
    schemas: public
    default-schema: public
    validate-on-migrate: false
    ignore-migration-patterns:
      - "*:missing"

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.cani: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:WARN}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_BIND_LOG:WARN}

cani:
  auth:
    supabase:
      url: ${SUPABASE_URL:https://hgnilsojrauajmyslhug.supabase.co}
      anon-key: ${SUPABASE_ANON_KEY:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}