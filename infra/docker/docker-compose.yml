version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cani-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cani_dev}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cani_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cani-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cani-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cani.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cani-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  cani-network:
    driver: bridge