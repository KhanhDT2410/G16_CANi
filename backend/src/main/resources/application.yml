spring:
  application:
    name: cani-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://db.hgnilsojrauajmyslhug.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 0
    clean-disabled: true
    schemas: public
    default-schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.cani: INFO
    org.springframework.security: INFO

cani:
  auth:
    supabase:
      url: ${SUPABASE_URL:https://hgnilsojrauajmyslhug.supabase.co}
      anon-key: ${SUPABASE_ANON_KEY:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models}
      timeout-ms: 20000
  ekyc:
    provider: ${EKYC_PROVIDER:vnpt}
    strict: ${EKYC_STRICT:false}
    vnpt:
      enabled: ${VNPT_EKYC_ENABLED:false}
      base-url: ${VNPT_EKYC_BASE_URL:https://api.idg.vnpt.vn}
      token-id: ${VNPT_EKYC_TOKEN_ID:}
      token-key: ${VNPT_EKYC_TOKEN_KEY:}
      access-token: ${VNPT_EKYC_ACCESS_TOKEN:}
      mac-address: ${VNPT_EKYC_MAC_ADDRESS:TEST1}
      timeout-ms: 25000
  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}
  subscription:
    strict: ${SUBSCRIPTION_STRICT:false}
  vnpay:
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/eo?tab=subscription}
  payos:
    endpoint: ${PAYOS_ENDPOINT:https://api-merchant.payos.vn}
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/eo?payos=success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/eo?payos=cancel}
  sla-scan:
    enabled: ${SLA_SCAN_ENABLED:true}
    cron: ${SLA_SCAN_CRON:0 */15 * * * *}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
