spring:
  application:
    name: cani-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://db.hgnilsojrauajmyslhug.supabase.co:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        type:
          preferred_enum_jdbc_type: NAMED_ENUM

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 0
    clean-disabled: true
    schemas: public
    default-schema: public

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.cani: INFO
    org.springframework.security: INFO

cani:
  auth:
    supabase:
      url: ${SUPABASE_URL:https://hgnilsojrauajmyslhug.supabase.co}
      anon-key: ${SUPABASE_ANON_KEY:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
      url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models}
      timeout-ms: 20000
  ekyc:
    provider: ${EKYC_PROVIDER:vnpt}
    vnpt:
      enabled: ${VNPT_EKYC_ENABLED:false}
      base-url: ${VNPT_EKYC_BASE_URL:https://api.idg.vnpt.vn}
      token-id: ${VNPT_EKYC_TOKEN_ID:5e7a3b1b-db74-1656-e063-63199f0a717f}
      token-key: ${VNPT_EKYC_TOKEN_KEY:MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAlvv9EToVRDb3ZS58HaSGBNDHN9GLm9lROWE4CxyRMHib2K1XCmSS6suua/4coDMvthnv8zKmUy25BiplQtd6MMCAwEAAQ==}
      access-token: ${VNPT_EKYC_ACCESS_TOKEN:}
      mac-address: ${VNPT_EKYC_MAC_ADDRESS:TEST1}
      timeout-ms: 25000
